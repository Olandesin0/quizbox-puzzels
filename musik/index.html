<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Quizbox · Musik</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
  :root {
    --grund: #26282b; --flaeche: #33363a; --rand: #44484d;
    --text: #eceae6; --leise: #a19d96;
    --terracotta: #c46a4a; --salie: #6f8f7a; --oker: #c9a24a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--grund); color: var(--text);
    font-family: 'DM Sans', system-ui, sans-serif; }
  main { max-width: 480px; margin: 0 auto; min-height: 100%; padding: 16px 16px 22px;
    display: flex; flex-direction: column; gap: 14px; }
  header { display: flex; justify-content: space-between; align-items: baseline; }
  h1 { font-size: 20px; margin: 0; font-weight: 700; }
  h1 span { color: var(--terracotta); }
  .zaehler { color: var(--leise); font-size: 15px; font-variant-numeric: tabular-nums; }
  .ansicht { display: none; flex-direction: column; gap: 14px; flex: 1; }
  .ansicht.an { display: flex; }
  button { font: inherit; border: 0; border-radius: 14px; cursor: pointer; color: var(--text); }
  button:disabled { cursor: default; }

  /* Start */
  .karte { background: var(--flaeche); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .karte h2 { margin: 0; font-size: 17px; }
  .anzahl { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .anzahl button { background: var(--grund); padding: 12px 0; font-size: 18px; font-weight: 600; box-shadow: inset 0 0 0 1px var(--rand); }
  .anzahl button.an { box-shadow: inset 0 0 0 2px var(--terracotta); color: var(--terracotta); }
  .namen { display: flex; flex-direction: column; gap: 8px; }
  .namen input { font: inherit; font-size: 16px; background: var(--grund); color: var(--text); border: 0;
    border-radius: 10px; padding: 12px; box-shadow: inset 0 0 0 1px var(--rand); outline: none; }
  .namen input:focus { box-shadow: inset 0 0 0 2px var(--terracotta); }

  /* Spiel */
  .oben { display: flex; align-items: center; gap: 14px; }
  .scheibe { flex: none; width: 76px; height: 76px; border-radius: 50%;
    background: radial-gradient(circle, var(--grund) 0 14%, var(--terracotta) 14.5% 18%, #1c1d20 18.5% 100%);
    box-shadow: inset 0 0 0 1px var(--rand); position: relative; }
  .scheibe::after { content: ""; position: absolute; inset: 14%; border-radius: 50%;
    background: repeating-radial-gradient(circle, transparent 0 3px, rgba(255,255,255,.05) 3px 4px); }
  .scheibe.dreht { animation: drehen 1.6s linear infinite; }
  @keyframes drehen { to { transform: rotate(360deg); } }
  .dran { font-size: 15px; color: var(--leise); }
  .dran b { display: block; font-size: 22px; color: var(--text); }
  .balken { height: 6px; background: var(--flaeche); border-radius: 3px; overflow: hidden; }
  .balken div { height: 100%; width: 0; background: var(--terracotta); }

  .leiter { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .stufe { background: var(--flaeche); padding: 12px 2px 9px; display: flex; flex-direction: column;
    align-items: center; gap: 2px; box-shadow: inset 0 0 0 1px var(--rand); }
  .stufe b { font-size: 18px; }
  .stufe small { color: var(--leise); font-size: 12px; }
  .stufe.gehoert { background: #3b3e43; }
  .stufe.aktiv { box-shadow: inset 0 0 0 2px var(--terracotta); }
  .stufe:disabled { opacity: .35; }

  .optionen { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .option { background: var(--flaeche); padding: 12px 10px; min-height: 78px; text-align: left;
    display: flex; flex-direction: column; justify-content: center; gap: 3px; box-shadow: inset 0 0 0 1px var(--rand); }
  .option b { font-size: 15px; line-height: 1.2; }
  .option small { font-size: 13px; color: var(--leise); }
  .option:disabled { opacity: .45; }
  .option.richtig { background: var(--salie); opacity: 1; box-shadow: none; }
  .option.richtig small { color: var(--text); }
  .option.falsch { background: var(--terracotta); opacity: 1; box-shadow: none; }
  .option.falsch small { color: var(--text); }

  .wahl { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .wahl button { padding: 18px 10px; font-size: 17px; font-weight: 600; }
  .wahl .weiss { background: var(--salie); }
  .wahl .tipp { background: var(--flaeche); box-shadow: inset 0 0 0 1px var(--rand); }
  .wahl .tipp small { display: block; font-size: 12px; font-weight: 400; color: var(--leise); margin-top: 2px; }
  .wahl button:disabled { opacity: .35; }
  .karte-loesung { background: var(--flaeche); border-radius: 16px; padding: 16px; text-align: center; display: flex; flex-direction: column; gap: 4px; }
  .karte-loesung .titel { font-size: 21px; font-weight: 700; color: var(--terracotta); }
  .karte-loesung .kuenstler { font-size: 16px; }
  .karte-loesung .frage { color: var(--leise); font-size: 14px; margin-top: 8px; }
  .urteil { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .urteil button { padding: 16px; font-size: 18px; font-weight: 700; }
  .urteil .ja { background: var(--salie); }
  .urteil .nein { background: var(--terracotta); }
  .meldung { text-align: center; font-size: 16px; color: var(--leise); min-height: 24px; }
  .meldung.gut { color: var(--salie); font-weight: 700; }
  .meldung.schlecht { color: var(--terracotta); font-weight: 700; }

  .aktionen { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: auto; }
  .aktionen.eins { grid-template-columns: 1fr; }
  .gross { padding: 15px; font-size: 17px; font-weight: 600; }
  .leise-knopf { background: var(--flaeche); box-shadow: inset 0 0 0 1px var(--rand); }
  .weiter { background: var(--terracotta); }
  .weiter:disabled, .leise-knopf:disabled { opacity: .35; }

  /* Ende */
  .rangliste { display: flex; flex-direction: column; gap: 8px; }
  .platz { background: var(--flaeche); border-radius: 14px; padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
  .platz .nr { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 700;
    background: var(--grund); color: var(--leise); flex: none; }
  .platz:first-child .nr { background: var(--oker); color: var(--grund); }
  .platz .name { flex: 1; font-size: 18px; font-weight: 600; }
  .platz .pkt { font-size: 20px; font-weight: 700; color: var(--terracotta); font-variant-numeric: tabular-nums; }
  .gross-titel { font-size: 24px; font-weight: 700; text-align: center; margin: 8px 0 4px; }

  footer { color: var(--leise); font-size: 12px; text-align: center; }
  footer a { color: var(--leise); }
</style>
</head>
<body>
<main>
  <header>
    <h1>Quizbox <span>·</span> <span>Intro</span></h1>
    <div class="zaehler" id="zaehler"></div>
  </header>

  <!-- Start -->
  <section class="ansicht" id="v-start">
    <div class="karte">
      <h2 id="t-spieler"></h2>
      <div class="anzahl" id="anzahl"></div>
      <div class="namen" id="namen"></div>
    </div>
    <div class="meldung" id="start-meldung"></div>
    <div class="aktionen eins"><button class="gross weiter" id="los" disabled></button></div>
  </section>

  <!-- Spiel -->
  <section class="ansicht" id="v-spiel">
    <div class="oben">
      <div class="scheibe" id="scheibe"></div>
      <div class="dran" id="dran"></div>
    </div>
    <div class="balken"><div id="fortschritt"></div></div>
    <div class="leiter" id="leiter"></div>
    <div id="bereich"></div>
    <div class="meldung" id="meldung"></div>
    <div class="aktionen">
      <button class="gross leise-knopf" id="passen"></button>
      <button class="gross weiter" id="weiter" disabled></button>
    </div>
  </section>

  <!-- Ende -->
  <section class="ansicht" id="v-ende">
    <div class="gross-titel" id="t-ende"></div>
    <div class="rangliste" id="rangliste"></div>
    <div class="aktionen eins"><button class="gross weiter" id="nochmal"></button></div>
  </section>

  <footer>♪ <a href="https://www.deezer.com" target="_blank" rel="noopener">Deezer</a> · <span id="t-fuss"></span></footer>
</main>

<script>
(() => {
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { try { tg.ready(); tg.expand(); tg.setHeaderColor('#26282b'); tg.setBackgroundColor('#26282b'); } catch (e) {} }
  const haptik = (art, wert) => { try { tg && tg.HapticFeedback && tg.HapticFeedback[art](wert); } catch (e) {} };

  // ---------- Sprache
  const url = new URLSearchParams(location.search);
  const tgUser = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
  const sprache = (url.get('lang') || (tgUser && tgUser.language_code) || 'de').slice(0, 2) === 'nl' ? 'nl' : 'de';
  const T = {
    de: { spieler: 'Wie viele spielen mit?', name: 'Spieler', los: 'Los geht’s ▸', laden: 'Lade Lieder …',
          bereit: n => `${n} Lieder bereit`, fehler: 'Deezer nicht erreichbar.', leer: 'Keine Lieder übergeben.',
          zuWenig: 'Mindestens 1 Lied mit Fragment nötig.', dran: 'ist dran', tippe: 'Tippe auf 2 s und rate laut!',
          erstHoeren: 'Erst reinhören …', punkte: 'Pkt.', passen: 'Weiß nicht', weissEs: 'Ich weiß es!', tipp: '💡 4 Optionen', tippKlein: 'halbe Punkte',
          frage: 'Richtig geraten?', ja: '✓ Richtig', nein: '✗ Falsch', weiter: 'Nächstes ▸', auswertung: 'Auswertung ▸',
          richtig: p => `Richtig! +${p}`, falsch: 'Leider falsch', gepasst: 'Gepasst – 0 Punkte',
          ende: 'Endstand 🎉', neu: 'Gleiche Lieder nochmal', fuss: '30-s-Fragmente' },
    nl: { spieler: 'Hoeveel spelers doen mee?', name: 'Speler', los: 'Beginnen ▸', laden: 'Nummers laden …',
          bereit: n => `${n} nummers klaar`, fehler: 'Deezer niet bereikbaar.', leer: 'Geen nummers meegegeven.',
          zuWenig: 'Minstens 1 nummer met fragment nodig.', dran: 'is aan de beurt', tippe: 'Tik op 2 s en raad hardop!',
          erstHoeren: 'Eerst even luisteren …', punkte: 'pnt', passen: 'Weet niet', weissEs: 'Ik weet het!', tipp: '💡 4 keuzes', tippKlein: 'halve punten',
          frage: 'Goed geraden?', ja: '✓ Goed', nein: '✗ Fout', weiter: 'Volgende ▸', auswertung: 'Uitslag ▸',
          richtig: p => `Goed! +${p}`, falsch: 'Helaas fout', gepasst: 'Gepast – 0 punten',
          ende: 'Eindstand 🎉', neu: 'Zelfde nummers opnieuw', fuss: 'fragmenten van 30 s' },
  }[sprache];
  document.documentElement.lang = sprache;
  const $ = id => document.getElementById(id);
  $('t-fuss').textContent = T.fuss;

  // ---------- Lieder aus dem Link: startapp=p_1_2_3 / d_123, oder ?ids=1,2,3 / ?id=123
  const start = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || url.get('tgWebAppStartParam') || '';
  let ids = [];
  if (/^[pd]_/.test(start)) ids = start.slice(2).split('_');
  else if (url.get('ids')) ids = url.get('ids').split(',');
  else if (url.get('id')) ids = [url.get('id')];
  ids = [...new Set(ids.map(s => s.trim()).filter(s => /^\d+$/.test(s)))];

  // ---------- Reserve für falsche Optionen (bekannte, familienfreundliche Titel)
  const RESERVE = [
    ['Bohemian Rhapsody','Queen'], ['Waterloo','ABBA'], ['Billie Jean','Michael Jackson'], ['Take On Me','a-ha'],
    ['Sweet Caroline','Neil Diamond'], ['Wind of Change','Scorpions'], ['Atemlos durch die Nacht','Helene Fischer'],
    ['Skandal im Sperrbezirk','Spider Murphy Gang'], ['Ein Kompliment','Sportfreunde Stiller'], ['Männer','Herbert Grönemeyer'],
    ['Westerland','Die Ärzte'], ['Tage wie diese','Die Toten Hosen'], ['Zoutelande','BLØF'], ['Avond','Boudewijn de Groot'],
    ['15 miljoen mensen','Fluitsma & Van Tijn'], ['Ik wil je','De Kast'], ['Leef','André Hazes Jr.'], ['Venus','Shocking Blue'],
    ['Twilight Zone','Golden Earring'], ['Mr. Blue Sky','Electric Light Orchestra'], ['Livin’ on a Prayer','Bon Jovi'],
    ['Wonderwall','Oasis'], ['Happy','Pharrell Williams'], ['Shape of You','Ed Sheeran'], ['Uptown Funk','Mark Ronson ft. Bruno Mars'],
    ['Rolling in the Deep','Adele'], ['I Gotta Feeling','The Black Eyed Peas'], ['Mamma Mia','ABBA'],
    ['Eye of the Tiger','Survivor'], ['Sweet Dreams (Are Made of This)','Eurythmics'], ['Hurra, hurra, die Schule brennt','Extrabreit'],
    ['Da Da Da','Trio'], ['Verdammt, ich lieb’ dich','Matthias Reim'], ['Wannabe','Spice Girls'],
  ].map(([titel, kuenstler]) => ({ titel, kuenstler }));

  const norm = s => (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]/g, '');
  const SCHLECHT = /\b(live|karaoke|instrumental|remix|mix|acoustic|akustik|unplugged|version|edit|demo|intro|outro|medley)\b/i;
  const sauber = t => (t || '').replace(/\s*[\(\[].*?[\)\]]/g, '').replace(/\s+-\s+.*$/, '').trim();
  const mischen = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  // ---------- Deezer per JSONP (die API erlaubt kein CORS)
  let jsonpNr = 0;
  function deezer(pfad) {
    return new Promise((ok, nok) => {
      const name = '__dz' + (++jsonpNr);
      const s = document.createElement('script');
      const timer = setTimeout(() => { aufraeumen(); nok(new Error('timeout')); }, 8000);
      function aufraeumen() { clearTimeout(timer); delete window[name]; s.remove(); }
      window[name] = d => { aufraeumen(); ok(d); };
      s.onerror = () => { aufraeumen(); nok(new Error('netz')); };
      s.src = `https://api.deezer.com${pfad}${pfad.includes('?') ? '&' : '?'}output=jsonp&callback=${name}`;
      document.head.appendChild(s);
    });
  }

  // ---------- Zustand
  const STUFEN = [ { s: 2, p: 3 }, { s: 5, p: 2 }, { s: 10, p: 1 }, { s: 30, p: 0.5 } ];
  const pktText = p => {
    const ganz = Math.floor(p + 1e-9), rest = Math.round((p - ganz) * 4);
    const bruch = ['', '¼', '½', '¾'][rest];
    return ganz === 0 && bruch ? bruch : `${ganz}${bruch}`;
  };
  let lieder = [];          // { id, titel, kuenstler, preview }
  let spieler = [];         // { name, punkte }
  let anzahl = 2;
  let pos = 0, audio = null, stopp = null, anim = null, freigeschaltet = 0, entschieden = false, optionen = [];
  let modus = 'frei';      // frei → (tipp | urteil) → fertig

  function zeigeAnsicht(id) {
    document.querySelectorAll('.ansicht').forEach(v => v.classList.toggle('an', v.id === id));
  }

  // ---------- Start: Spieler wählen, Lieder vorladen
  function gespeicherteNamen() {
    try { return JSON.parse(localStorage.getItem('quizbox-namen') || '[]'); } catch (e) { return []; }
  }
  function speichereNamen(namen) { try { localStorage.setItem('quizbox-namen', JSON.stringify(namen)); } catch (e) {} }

  function startZeichnen() {
    $('t-spieler').textContent = T.spieler;
    $('los').textContent = T.los;
    const alt = gespeicherteNamen();
    const box = $('anzahl'); box.innerHTML = '';
    [1, 2, 3, 4].forEach(n => {
      const b = document.createElement('button');
      b.textContent = n; b.className = n === anzahl ? 'an' : '';
      b.onclick = () => { anzahl = n; startZeichnen(); };
      box.appendChild(b);
    });
    const namen = $('namen');
    const bisher = [...namen.querySelectorAll('input')].map(i => i.value);
    namen.innerHTML = '';
    for (let i = 0; i < anzahl; i++) {
      const inp = document.createElement('input');
      inp.maxLength = 16;
      inp.placeholder = `${T.name} ${i + 1}`;
      inp.value = bisher[i] !== undefined ? bisher[i] : (alt[i] || (i === 0 && tgUser && tgUser.first_name) || '');
      namen.appendChild(inp);
    }
  }

  async function liederLaden() {
    if (!ids.length) { $('start-meldung').textContent = T.leer; return; }
    $('start-meldung').textContent = T.laden;
    const ergebnisse = await Promise.allSettled(ids.map(id => deezer(`/track/${id}`)));
    lieder = ergebnisse
      .map(e => e.status === 'fulfilled' ? e.value : null)
      .filter(d => d && !d.error && d.preview)
      .map(d => ({ id: d.id, titel: d.title_short || d.title, kuenstler: d.artist ? d.artist.name : '',
                    kuenstlerId: d.artist ? d.artist.id : null, preview: d.preview, gleicherKuenstler: [] }));
    if (!lieder.length) {
      $('start-meldung').textContent = ergebnisse.every(e => e.status === 'rejected') ? T.fehler : T.zuWenig;
      return;
    }
    // Andere bekannte Titel derselben Künstler (für eine schwierige falsche Option)
    const kuenstlerIds = [...new Set(lieder.map(l => l.kuenstlerId).filter(Boolean))];
    const tops = await Promise.allSettled(kuenstlerIds.map(id => deezer(`/artist/${id}/top?limit=15`)));
    const topNach = {};
    tops.forEach((t, i) => { if (t.status === 'fulfilled' && t.value && Array.isArray(t.value.data)) topNach[kuenstlerIds[i]] = t.value.data; });
    lieder.forEach(l => {
      const eigen = norm(sauber(l.titel));
      l.gleicherKuenstler = [...new Set((topNach[l.kuenstlerId] || [])
        .filter(t => !SCHLECHT.test(`${t.title || ''} ${t.title_version || ''}`))
        .map(t => sauber(t.title_short || t.title))
        .filter(t => t && norm(t) !== eigen && !norm(t).includes(eigen) && !eigen.includes(norm(t))))];
    });
    lieder = mischen(lieder);
    $('start-meldung').textContent = T.bereit(lieder.length);
    $('los').disabled = false;
  }

  $('los').onclick = () => {
    const namen = [...$('namen').querySelectorAll('input')].map((inp, i) => inp.value.trim() || `${T.name} ${i + 1}`);
    speichereNamen(namen);
    spieler = namen.map(name => ({ name, punkte: 0 }));
    pos = 0;
    zeigeAnsicht('v-spiel');
    liedZeigen();
  };

  // ---------- Spiel
  function optionenBauen(lied) {
    const gesehen = new Set([norm(sauber(lied.titel))]);
    const falsche = [];
    // 1) schwierige Option: anderer Titel derselben Künstler
    const gleich = mischen(lied.gleicherKuenstler)[0];
    if (gleich) { gesehen.add(norm(gleich)); falsche.push({ titel: gleich, kuenstler: lied.kuenstler }); }
    // 2) Rest: andere Lieder der Runde, dann Reserve – jeweils andere Künstler
    const kuenstlerGesehen = new Set([norm(lied.kuenstler)]);
    const kandidaten = mischen(lieder.filter(l => l !== lied)).concat(mischen(RESERVE));
    for (const k of kandidaten) {
      if (falsche.length === 3) break;
      const n = norm(sauber(k.titel)), kn = norm(k.kuenstler);
      if (gesehen.has(n) || kuenstlerGesehen.has(kn)) continue;
      gesehen.add(n); kuenstlerGesehen.add(kn);
      falsche.push({ titel: sauber(k.titel) || k.titel, kuenstler: k.kuenstler });
    }
    return mischen([{ titel: lied.titel, kuenstler: lied.kuenstler, richtig: true },
                    ...falsche.map(f => ({ ...f, richtig: false }))]);
  }

  function leiterZeichnen() {
    const box = $('leiter'); box.innerHTML = '';
    STUFEN.forEach((st, i) => {
      const b = document.createElement('button');
      b.className = 'stufe' + (i < freigeschaltet ? ' gehoert' : '') + (i === freigeschaltet - 1 ? ' aktiv' : '');
      b.innerHTML = `<b>${st.s} s</b><small>${pktText(st.p)} ${T.punkte}</small>`;
      // vor der Entscheidung: nur nächste Stufe oder schon gehörte; danach alles frei zum Nachhören
      b.disabled = !audio || (!entschieden && (modus === 'urteil' || i > freigeschaltet));
      b.onclick = () => abspielen(i);
      box.appendChild(b);
    });
  }

  function loesungKarte(mitFrage) {
    const lied = lieder[pos];
    const k = document.createElement('div'); k.className = 'karte-loesung';
    const a = document.createElement('div'); a.className = 'titel'; a.textContent = lied.titel;
    const b = document.createElement('div'); b.className = 'kuenstler'; b.textContent = lied.kuenstler;
    k.append(a, b);
    if (mitFrage) { const f = document.createElement('div'); f.className = 'frage'; f.textContent = T.frage; k.append(f); }
    return k;
  }

  function bereichZeichnen() {
    const box = $('bereich'); box.innerHTML = '';
    if (modus === 'frei') {
      const w = document.createElement('div'); w.className = 'wahl';
      const weiss = document.createElement('button'); weiss.className = 'weiss'; weiss.textContent = T.weissEs;
      const tipp = document.createElement('button'); tipp.className = 'tipp';
      tipp.innerHTML = `${T.tipp}<small>${T.tippKlein}</small>`;
      weiss.disabled = tipp.disabled = freigeschaltet === 0;
      weiss.onclick = () => { anhalten(); modus = 'urteil'; $('passen').disabled = true; meldung(''); bereichZeichnen(); leiterZeichnen(); };
      tipp.onclick = () => { modus = 'tipp'; meldung(''); bereichZeichnen(); };
      w.append(weiss, tipp); box.append(w);
      return;
    }
    if (modus === 'urteil') {
      box.append(loesungKarte(true));
      const u = document.createElement('div'); u.className = 'urteil'; u.style.marginTop = '10px';
      const ja = document.createElement('button'); ja.className = 'ja'; ja.textContent = T.ja;
      const nein = document.createElement('button'); nein.className = 'nein'; nein.textContent = T.nein;
      ja.onclick = () => werten(true, 1); nein.onclick = () => werten(false, 1);
      u.append(ja, nein); box.append(u);
      return;
    }
    if (modus === 'fertig' && !optionen.some(o => o.gewaehlt)) { box.append(loesungKarte(false)); return; }
    // tipp oder fertig nach Tipp: 4 Optionen
    const g = document.createElement('div'); g.className = 'optionen';
    optionen.forEach(o => {
      const b = document.createElement('button'); b.className = 'option';
      const t = document.createElement('b'); t.textContent = o.titel;
      const k = document.createElement('small'); k.textContent = o.kuenstler;
      b.append(t, k);
      b.disabled = entschieden;
      if (entschieden && o.richtig) b.classList.add('richtig');
      if (entschieden && o.gewaehlt && !o.richtig) b.classList.add('falsch');
      b.onclick = () => { o.gewaehlt = true; werten(o.richtig, 0.5); };
      g.appendChild(b);
    });
    box.append(g);
  }

  function meldung(text, art) { const m = $('meldung'); m.textContent = text; m.className = 'meldung' + (art ? ' ' + art : ''); }

  function liedZeigen() {
    anhalten();
    const lied = lieder[pos];
    const sp = spieler[pos % spieler.length];
    freigeschaltet = 0; entschieden = false; modus = 'frei';
    optionen = optionenBauen(lied);
    $('zaehler').textContent = `${pos + 1} / ${lieder.length}`;
    $('dran').innerHTML = '';
    const n = document.createElement('b'); n.textContent = sp.name;
    $('dran').append(n, document.createTextNode(spieler.length > 1 ? T.dran : ''));
    $('fortschritt').style.width = '0';
    $('passen').textContent = T.passen; $('passen').disabled = false;
    $('weiter').textContent = pos >= lieder.length - 1 ? T.auswertung : T.weiter;
    $('weiter').disabled = true;
    audio = new Audio(lied.preview);
    audio.preload = 'auto';
    audio.onerror = async () => {             // Fragment-Link abgelaufen → frisch holen
      if (audio.dataset && audio.dataset.neu) return;
      try { const d = await deezer(`/track/${lied.id}`); if (d && d.preview) { lied.preview = d.preview; audio.src = d.preview; audio.dataset.neu = '1'; } } catch (e) {}
    };
    meldung(T.tippe);
    leiterZeichnen(); bereichZeichnen();
  }

  function anhalten() {
    clearTimeout(stopp); cancelAnimationFrame(anim);
    if (audio) { audio.pause(); audio.volume = 1; }
    $('scheibe').classList.remove('dreht');
  }

  function abspielen(i) {
    if (!audio) return;
    anhalten();
    if (!entschieden && i + 1 > freigeschaltet) freigeschaltet = i + 1;
    leiterZeichnen(); bereichZeichnen();
    if (!entschieden && meldungIstHinweis()) meldung('');
    const dauer = STUFEN[i].s * 1000;
    audio.currentTime = 0; audio.volume = 1;
    audio.play().catch(() => {});
    $('scheibe').classList.add('dreht');
    haptik('impactOccurred', 'light');
    const t0 = performance.now();
    const schritt = () => {
      const t = performance.now() - t0;
      $('fortschritt').style.width = Math.min(100, t / dauer * 100) + '%';
      if (t > dauer - 300) audio.volume = Math.max(0, (dauer - t) / 300);
      if (t < dauer) anim = requestAnimationFrame(schritt);
    };
    anim = requestAnimationFrame(schritt);
    stopp = setTimeout(anhalten, dauer);
  }
  const meldungIstHinweis = () => $('meldung').textContent === T.tippe;

  function entscheiden() {
    entschieden = true;
    $('passen').disabled = true;
    $('weiter').disabled = false;
    leiterZeichnen(); bereichZeichnen();
  }

  function werten(richtig, faktor) {
    if (entschieden || freigeschaltet === 0) return;
    const sp = spieler[pos % spieler.length];
    if (richtig) {
      const p = STUFEN[freigeschaltet - 1].p * faktor;
      sp.punkte += p;
      meldung(T.richtig(pktText(p)), 'gut');
      haptik('notificationOccurred', 'success');
    } else {
      meldung(T.falsch, 'schlecht');
      haptik('notificationOccurred', 'error');
    }
    modus = 'fertig';
    entscheiden();
  }

  $('passen').onclick = () => {
    if (entschieden) return;
    meldung(T.gepasst, 'schlecht');
    modus = 'fertig';
    entscheiden();
  };

  $('weiter').onclick = () => {
    anhalten();
    pos++;
    if (pos < lieder.length) liedZeigen(); else endeZeigen();
  };

  // ---------- Ende
  function endeZeigen() {
    $('zaehler').textContent = '';
    $('t-ende').textContent = T.ende;
    const box = $('rangliste'); box.innerHTML = '';
    spieler.slice().sort((a, b) => b.punkte - a.punkte).forEach((sp, i, arr) => {
      const platz = i > 0 && sp.punkte === arr[i - 1].punkte ? box.lastChild.dataset.nr : String(i + 1);
      const d = document.createElement('div'); d.className = 'platz'; d.dataset.nr = platz;
      const nr = document.createElement('div'); nr.className = 'nr'; nr.textContent = platz;
      const name = document.createElement('div'); name.className = 'name'; name.textContent = sp.name;
      const pkt = document.createElement('div'); pkt.className = 'pkt'; pkt.textContent = pktText(sp.punkte);
      d.append(nr, name, pkt); box.appendChild(d);
    });
    $('nochmal').textContent = T.neu;
    zeigeAnsicht('v-ende');
    haptik('notificationOccurred', 'success');
  }

  $('nochmal').onclick = () => {
    lieder = mischen(lieder);
    spieler.forEach(s => { s.punkte = 0; s.gewaehlt = false; });
    pos = 0;
    zeigeAnsicht('v-spiel');
    liedZeigen();
  };

  // ---------- Los
  startZeichnen();
  zeigeAnsicht('v-start');
  liederLaden();
})();
</script>
</body>
</html>
